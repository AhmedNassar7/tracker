<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>Offline — tracker</title>
  <link rel="icon" type="image/svg+xml" href="/tracker/favicon.svg" />
  <!-- Static on purpose: this is what the service worker serves when the
       network is down AND the requested page was never saved. It can't depend
       on the app's own CSS/JS (those may not be cached either), so it carries
       its own tiny stylesheet and follows the OS light/dark setting. -->
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #0f172a; --muted: #64748b; --accent: #0f766e; --border: #e2e8f0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #020617; --fg: #f1f5f9; --muted: #94a3b8; --accent: #2dd4bf; --border: #1e293b; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: var(--bg); color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 26rem; text-align: center; }
    svg { width: 3rem; height: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1.25rem; color: var(--muted); }
    .actions { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
    a, button { font: inherit; padding: .55rem 1rem; border-radius: .5rem; border: 1px solid var(--border); background: transparent; color: var(--fg); cursor: pointer; text-decoration: none; }
    a.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    @media (prefers-color-scheme: dark) { a.primary { color: #042f2e; } }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="#0f766e"/><g fill="none" stroke="#fff" stroke-width="9"><circle cx="64" cy="64" r="34"/><circle cx="64" cy="64" r="15"/></g><circle cx="64" cy="64" r="6" fill="#fff"/><g stroke="#fff" stroke-width="9" stroke-linecap="round"><path d="M64 18v14M64 96v14M18 64h14M96 64h14"/></g></svg>
    <h1>You're offline</h1>
    <p>This page wasn't saved on this device, so it can't open without a connection. Pages you've already visited, and the last listings we loaded, are still available.</p>
    <div class="actions">
      <a class="primary" href="/tracker/">Open saved listings</a>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </main>
</body>
</html>
