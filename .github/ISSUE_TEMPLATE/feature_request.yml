name: Feature request
description: Suggest an idea, a new source/company to track, or an improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Adding a company or job board? Just the name and a link is enough — no need to fill out the rest.
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or gap?
      description: What are you trying to do that isn't possible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and didn't find this already requested
          required: true
