name: Hourly Global Tech Roles PR

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: frequent-global-tech-roles
  cancel-in-progress: false

jobs:
  hourly-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run fetch pipeline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw
          python3 scripts/fetch.py

      - name: Run public opportunity layer
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/public_sources.py

      - name: Rebuild README pages from data
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_data_readme.py

      - name: Update timestamp
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(date -u +'%Y-%m-%d')"
          TIME="$(date -u +'%H:%M:%S UTC')"
          echo "${TODAY} ${TIME}" > LAST_UPDATED

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "chore: global tech roles"
          title: "chore: global tech roles snapshot"
          author: "AhmedNassar7 <a.moh.nassar00@users.noreply.github.com>"
          committer: "AhmedNassar7 <a.moh.nassar00@users.noreply.github.com>"
          body: |
            Automated global tech roles snapshot (scheduled hourly).

            **Schedule (UTC):** every hour at :15
            **Levels:** Internship / New Grad / Junior / Entry Level / Mid-Level
            **Companies:** Top-tier allowlist only ([config/companies_allowlist.yml](config/companies_allowlist.yml))

            **Curated sources** (scripts/fetch.py):
            - Remotive API
            - ArbeitNow API
            - SimplifyJobs Internships
            - SimplifyJobs New Grad
            - speedyapply (SWE + AI)
            - zapplyjobs (New Grad SWE, New Grad all-disciplines, Internships, Data Science, Canada Jobs, Canada Internships)
            - vanshb03 (Summer Internships, New Grad)
            - hanzili Canada SDE
            - ambicuity New-Grad-Jobs

            **Public-board sources** (scripts/public_sources.py):
            - Devpost hackathons
            - Luma discovery pages (tech/software-relevant only)
            - Greenhouse public job boards (auto-discovered)
            - Lever public postings (auto-discovered)
            - Workday CXS job boards (auto-discovered)
            - Ashby public job boards ([config/extra_job_boards.yml](config/extra_job_boards.yml))
            - SmartRecruiters public postings ([config/extra_job_boards.yml](config/extra_job_boards.yml))

            Every apply link is checked before publishing; dead ones move to the archive automatically. See [CONTRIBUTING.md](CONTRIBUTING.md) for how the pipeline works.
          branch: "frequent/global-roles-${{ github.run_id }}"
          delete-branch: true
          labels: automated

      - name: Merge PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --squash --delete-branch