name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run test suite
        run: |
          python3 tests/test_net.py
          python3 tests/test_fetch.py
          python3 tests/test_patterns.py
          python3 tests/test_public_sources.py
          python3 tests/test_schema_validation.py
          python3 tests/test_site_index.py
          python3 tests/test_stats_history.py
          python3 tests/test_rss_feeds.py
