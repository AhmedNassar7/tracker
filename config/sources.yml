# Reference documentation only — this file is NOT read by the pipeline.
# scripts/fetch.py calls every source below directly with hardcoded URLs;
# this list just documents what those calls do and why.
#
# To change actual behavior:
#   - Which companies are accepted → edit config/companies_allowlist.yml (no code)
#   - Which Ashby/SmartRecruiters companies are tracked → edit config/extra_job_boards.yml (no code)
#   - Add a brand-new API/board type → add a fetcher function in scripts/fetch.py
#     or scripts/public_sources.py (requires Python), then update this file to match.

sources:
  - id: remotive
    name: Remotive
    type: api
    url: "https://remotive.com/api/remote-jobs?category=software-dev"
    enabled: true
    attribution_url: "https://remotive.com"
    description: "Global remote job board with strong SWE coverage"

  - id: arbeitnow
    name: ArbeitNow
    type: api
    url: "https://arbeitnow.com/api/job-board-api"
    enabled: true
    attribution_url: "https://arbeitnow.com"
    description: "Remote work focused job board"

  - id: simplify_internships
    name: SimplifyJobs Summer Internships
    type: github
    url: "https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/README.md"
    enabled: true
    attribution_url: "https://github.com/SimplifyJobs/Summer2026-Internships"
    description: "Curated summer internship positions at top companies"

  - id: simplify_newgrad
    name: SimplifyJobs New Grad
    type: github
    url: "https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/README.md"
    enabled: true
    attribution_url: "https://github.com/SimplifyJobs/New-Grad-Positions"
    description: "New graduate software engineer positions"

  - id: speedyapply_swe
    name: speedyapply 2027 SWE College Jobs
    type: github
    url: "https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/README.md"
    enabled: true
    attribution_url: "https://github.com/speedyapply/2027-SWE-College-Jobs"
    description: "Community-tracked SWE internship/new-grad roles, US + international"

  - id: speedyapply_ai
    name: speedyapply 2027 AI College Jobs
    type: github
    url: "https://raw.githubusercontent.com/speedyapply/2027-AI-College-Jobs/main/README.md"
    enabled: true
    attribution_url: "https://github.com/speedyapply/2027-AI-College-Jobs"
    description: "Same tracker, focused on AI/ML/data science roles"

  - id: zapplyjobs_newgrad
    name: zapplyjobs New Grad Software Engineering Jobs 2027
    type: github
    url: "https://raw.githubusercontent.com/zapplyjobs/New-Grad-Software-Engineering-Jobs-2027/main/README.md"
    enabled: true
    attribution_url: "https://github.com/zapplyjobs/New-Grad-Software-Engineering-Jobs-2027"
    description: "Fast-growing community new-grad SWE tracker"

  - id: hanzili_canada
    name: hanzili Canada SDE Junior/New Grad
    type: github
    url: "https://raw.githubusercontent.com/hanzili/canada_sde_junior_new_grad_position/main/README.md"
    enabled: true
    attribution_url: "https://github.com/hanzili/canada_sde_junior_new_grad_position"
    description: "The dedicated tracker for Canadian new-grad/junior/co-op roles"

  - id: ambicuity
    name: ambicuity New-Grad-Jobs
    type: api
    url: "https://jobs.riteshrana.engineer/jobs.json"
    enabled: true
    attribution_url: "https://github.com/ambicuity/New-Grad-Jobs"
    description: "Fully automated new-grad tracker with a real JSON feed, refreshed every 5 minutes upstream"

  - id: remoteok
    name: RemoteOK
    type: api
    url: "https://remoteok.com/api?tags=dev"
    enabled: false
    attribution_url: "https://remoteok.com"
    description: "General remote job board (disabled - high noise)"

# PER-COMPANY BOARD SOURCES (implemented in scripts/public_sources.py, not this file)
#
# - Greenhouse, Lever, and Workday: no setup needed. Company boards are
#   auto-discovered from job URLs already present in data/jobs-global.json —
#   the first time a company's posting shows up via any other source, its
#   board is picked up and fetched directly on the next run.
# - Ashby and SmartRecruiters: no auto-discovery, so companies are curated by
#   hand in config/extra_job_boards.yml (plain list, no code needed).
