  - cloudflare
  - spacex
  - coinbase

lever:
  # Same discipline: real Lever board confirmed live 2026-08-18 with actual
  # postings, not just a non-404 response. NB: Lever slugs are CASE-SENSITIVE
  # — the token here must match the exact casing in the jobs.lever.co/<slug>
  # URL (e.g. "Bosta", not "bosta").
  - spotify
  - palantir
  - paytm
  - dlocal
  - Bosta  # Cairo, Egypt logistics — verified by hand 2026-09-06 (jobs.lever.co/Bosta, real Cairo eng roles). Case matters.

# ---------------------------------------------------------------------------
# MENA / Gulf / North Africa focus (Lane M) — three paths, in order of ease:
#
# 1. Real Greenhouse/Lever/Ashby board  → add the EXACT-CASE token here
#    (slugs are case-sensitive; verify_extra_boards.py auto-retries variants).
#    Confirmed & added:  Bosta → jobs.lever.co/Bosta (Cairo, lever:) ·
#    Mercor → ashby mercor (SF AI-data, "Powered by ashby", 96 jobs, ashby:).
#
# 2. Bespoke careers site (no pollable board)  → one row in
#    config/aggregate_links.yml instead ("Browse every role at X"), never a
#    fake posting. Added: Halan (jobs.halan.com). Same route once you've
#    opened the URL: Swvl, Paymob, Vezeeta, Sylndr, …
#
# 3. Workable / PinpointHQ / BambooHR  → needs a fetcher (Lane M3 / backlog
#    B2). The Egyptian startup scene is mostly Workable (Elmenus, Breadfast,
#    Rabbit, …); Tabby is on PinpointHQ; **Instabug (now "Luciq")** is on
#    BambooHR (instabug.bamboohr.com — check with `verify_extra_boards.py
#    bamboohr:instabug`).
#
# To check a token:  python scripts/verify_extra_boards.py lever:<Slug>
# A "⚠ couldn't reach …" line means your network blocked it, NOT that the
# board is missing — re-run or check from another network.
# ---------------------------------------------------------------------------

workday:
  # Big global employers whose careers site is Workday but who never get
  # auto-discovered because no curated source links a *.myworkdayjobs.com URL
  # for them (their community-tracker rows point at the company's own careers
  # page instead). Format: "Company Name | host | site" — Workday has no bare
  # token; each tenant is its own subdomain plus a site path. Verify with:
  #   curl -s -XPOST -H 'Content-Type: application/json' -d '{"limit":5,"offset":0,"searchText":"software engineer"}' \
  #     https://<host>/wday/cxs/<tenant>/<site>/jobs
  # All confirmed live 2026-09-06 with real software-engineer results.
  - Salesforce | salesforce.wd12.myworkdayjobs.com | External_Career_Site   # 527 SWE results
  - NVIDIA | nvidia.wd5.myworkdayjobs.com | NVIDIAExternalCareerSite         # 1719 SWE results
  - Adobe | adobe.wd5.myworkdayjobs.com | external_experienced              # 287 SWE results
  - Visa | visa.wd5.myworkdayjobs.com | Visa                                # 180 SWE results
  - Mastercard | mastercard.wd1.myworkdayjobs.com | CorporateCareers        # 325 SWE results
  - Workday | workday.wd5.myworkdayjobs.com | Workday                       # 153 SWE results
