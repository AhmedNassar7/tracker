  # Everything below: real Greenhouse board confirmed live 2026-08-18 (non-empty
  # jobs array, not just a non-404 response) for a company already in
  # config/companies_allowlist.yml whose board had never been auto-discovered —
  # none of these companies ever happened to appear in another curated source
  # first, so discover_job_board_sources() never had a URL to find them from.
  - linkedin
  - datadog
  - databricks
  - mongodb
  - elastic
  - twilio
  - stripe
  - okta
  - figma
  - dropbox
  - asana
  - anthropic
  - deepmind
  - scaleai
  - n26
  - lyft
  - airbnb
  - janestreet
  - coupang
  - baidu
  - jumia
  - tamara  # Riyadh/Dubai fintech (BNPL) — verified live 2026-09-05, 33 real postings incl. Dubai/Riyadh/Cairo
  - block
  - robinhood
  - instacart
  - pinterest
  - reddit
  - roblox
  - epicgames
  - discord
  - duolingo
  - webflow
  # Second verification pass, 2026-08-18: three companies that had transient
  # connection failures in the first pass, retried and confirmed real.
  - cloudflare
  - spacex
  - coinbase

lever:
  # Same discipline: real Lever board confirmed live 2026-08-18 with actual
  # postings, not just a non-404 response.
  - spotify
  - palantir
  - paytm
  - dlocal

# ---------------------------------------------------------------------------
# MENA / Gulf / North Africa focus (Lane M) — CANDIDATES, NOT YET VERIFIED.
#
# These are regional tech employers that plausibly run a public board on one
# of the platforms above. DO NOT uncomment a line until you've confirmed a
# real, non-empty jobs response by hand (the curl commands at the top of this
# file). The board token guess is in parentheses. Move a verified one up into
# the right section with a "# verified <date>, N postings incl. <city>" note.
#
#   greenhouse candidates: swvl (swvl) · paymob (paymob) · moneyhash (moneyhash)
#     · instabug (instabug) · rasan (rasan) · foodics (foodics) · nana (nanadirect)
#     · unifonic (unifonic) · zid (zid) · salla (salla) · lean (leantech)
#     · sary (sary) · tabby (tabby) · mamo (mamopay) · huspy (huspy)
#     · nawy (nawy) · sylndr (sylndr) · telda (telda) · bosta (bosta)
#   lever candidates: halan / mnt-halan (mnthalan) · trella (trella)
#   ashby candidates: telda · money-hash · nawy   (Ashby 404s an invalid token,
#     so these are the safest to check: curl https://api.ashbyhq.com/posting-api/job-board/<token>)
#   Workable is huge in the Egyptian startup scene (elmenus, breadfast, rabbit,
#     …) but there's no Workable fetcher yet — see §3A / backlog B2.
# ---------------------------------------------------------------------------

workday:
  # Big global employers whose careers site is Workday but who never get
  # auto-discovered because no curated source links a *.myworkdayjobs.com URL
  # for them (their community-tracker rows point at the company's own careers
  # page instead). Format: "Company Name | host | site" — Workday has no bare
  # token; each tenant is its own subdomain plus a site path. Verify with:
  #   curl -s -XPOST -H 'Content-Type: application/json' -d '{"limit":5,"offset":0,"searchText":"software engineer"}' \
  #     https://<host>/wday/cxs/<tenant>/<site>/jobs
  # All confirmed live 2026-09-06 with real software-engineer results.
  - Salesforce | salesforce.wd12.myworkdayjobs.com | External_Career_Site   # 527 SWE results
  - NVIDIA | nvidia.wd5.myworkdayjobs.com | NVIDIAExternalCareerSite         # 1719 SWE results
  - Adobe | adobe.wd5.myworkdayjobs.com | external_experienced              # 287 SWE results
  - Visa | visa.wd5.myworkdayjobs.com | Visa                                # 180 SWE results
  - Mastercard | mastercard.wd1.myworkdayjobs.com | CorporateCareers        # 325 SWE results
  - Workday | workday.wd5.myworkdayjobs.com | Workday                       # 153 SWE results
