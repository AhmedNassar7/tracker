lever:
  # Same discipline: real Lever board confirmed live 2026-08-18 with actual
  # postings, not just a non-404 response. NB: Lever slugs are CASE-SENSITIVE
  # — the token here must match the exact casing in the jobs.lever.co/<slug>
  # URL (e.g. "Bosta", not "bosta").
  - spotify
  - palantir
  - paytm
  - dlocal
  - Bosta  # Cairo, Egypt logistics — verified by hand 2026-09-06 (jobs.lever.co/Bosta, real Cairo eng roles). Case matters.
  - incorta  # Analytics/BI SaaS (San Mateo, US + Riyadh) — verified 2026-09-07 via api.lever.co/v0/postings/incorta, real postings incl. BI Solution Engineer - Riyadh

# ---------------------------------------------------------------------------
# Adding an employer whose board isn't auto-discovered — three paths, easiest
# first. (Regional focus is MENA / Gulf / North Africa, Lane M — but tag each
# entry with its actual city; e.g. Mercor above is San Francisco, not MENA.)
#
# 1. Real Greenhouse/Lever/Ashby board  → add the EXACT-CASE token here
#    (slugs are case-sensitive; verify_extra_boards.py auto-retries variants).
#    Verified & added so far:  Bosta (lever, Cairo) · Mercor (ashby, SF) ·
#    Incorta (lever, San Mateo/Riyadh).
#
# 2. Bespoke careers site, no pollable board  → one row in
#    config/aggregate_links.yml instead ("Browse every role at X"), never a
#    fake posting. Added: Halan (jobs.halan.com, Cairo).
#
# 3. PinpointHQ  → SUPPORTED (fetch_pinpoint_jobs, added 2026-09-06). Add the
#    board under the `pinpoint:` section below: a bare token becomes
#    <token>.pinpointhq.com, a token with a dot is used as a full custom host
#    (e.g. careers.moneyfellows.com). Live: Tabby (Dubai/Riyadh), Money Fellows
#    (Cairo).
#
# 4. On Workable / BambooHR / Recruitee / Freshteam  → the pipeline has NO
#    fetcher for these yet (Lane M3 / backlog B2), so a token here does
#    nothing until one is built. verify_extra_boards.py already CONFIRMS the
#    first three (2026-09-06: Instabug-"Luciq" ✓ on bamboohr, MoneyHash on
#    recruitee but 0 open; Breadfast is on Freshteam). Use
#    `verify_extra_boards.py --dump <platform>:<token>` to see the JSON shape
#    a fetcher must parse.
#
# To check a token:  python scripts/verify_extra_boards.py lever:<Slug>
# A "⚠ couldn't reach …" line = your network blocked it, NOT a missing board.
# ---------------------------------------------------------------------------

pinpoint:
  # PinpointHQ boards. A bare token is a <token>.pinpointhq.com subdomain;
  # a token with a dot is a full custom careers host. Verify with
  #   python scripts/verify_extra_boards.py pinpoint:<token>
  - tabby                      # Dubai/Riyadh BNPL fintech — verified 2026-09-06, 44 postings incl. Senior Fullstack Engineer
  - careers.moneyfellows.com   # Cairo, Egypt fintech (ROSCA app) — verified 2026-09-06, 8 postings

workday:
  # Big global employers whose careers site is Workday but who never get
  # auto-discovered because no curated source links a *.myworkdayjobs.com URL
  # for them (their community-tracker rows point at the company's own careers
  # page instead). Format: "Company Name | host | site" — Workday has no bare
  # token; each tenant is its own subdomain plus a site path. Verify with:
  #   curl -s -XPOST -H 'Content-Type: application/json' -d '{"limit":5,"offset":0,"searchText":"software engineer"}' \
  #     https://<host>/wday/cxs/<tenant>/<site>/jobs
  # All confirmed live 2026-09-06 with real software-engineer results.
  - Salesforce | salesforce.wd12.myworkdayjobs.com | External_Career_Site   # 527 SWE results
  - NVIDIA | nvidia.wd5.myworkdayjobs.com | NVIDIAExternalCareerSite         # 1719 SWE results
  - Adobe | adobe.wd5.myworkdayjobs.com | external_experienced              # 287 SWE results
  - Visa | visa.wd5.myworkdayjobs.com | Visa                                # 180 SWE results
  - Mastercard | mastercard.wd1.myworkdayjobs.com | CorporateCareers        # 325 SWE results
  - Workday | workday.wd5.myworkdayjobs.com | Workday                       # 153 SWE results
  - Valeo | valeo.wd3.myworkdayjobs.com | valeo_jobs                        # verified 2026-09-07, 1020 total incl. real Cairo posting (AI Engineer, AI4ALL)
