# Companies for the Ashby, SmartRecruiters, and hand-seeded Greenhouse/Lever
# public job-board APIs.
#
# Ashby and SmartRecruiters have no discovery mechanism, so their companies
# are always curated here by hand. Greenhouse and Lever normally auto-discover
# a company's board the first time one of its postings shows up in another
# curated source — the greenhouse:/lever: sections below are the manual
# escape hatch for a company that never happens to appear that way (e.g. a
# MENA-region company none of the mostly US/EU-focused curated sources ever
# mention), even though its board is sitting right there, publicly pollable.
#
# To add a company, add one line under the right section with its board
# token/company identifier, then verify it works by opening the API URL
# directly in a browser before opening a pull request:
#   Ashby:            https://api.ashbyhq.com/posting-api/job-board/<token>
#   SmartRecruiters:   https://api.smartrecruiters.com/v1/companies/<token>/postings
#   Greenhouse:        https://boards-api.greenhouse.io/v1/boards/<token>/jobs
#   Lever:             https://api.lever.co/v0/postings/<token>?mode=json
# No Python changes are needed — scripts/public_sources.py reads this file automatically.

ashby:
  - notion
  - linear
  - ramp
  - deel
  - vercel
  - airtable
  - loom
  - substack
  - attio
  - mercury
  - plaid
  - cohere
  - openai
  - clickhouse
  - thndr  # Cairo, Egypt fintech — verified live 2026-08-18, real Cairo-office postings
  - snowflake  # verified live 2026-08-18, real non-empty board (4.8MB, genuine postings)

smartrecruiters:
  - Visa
  - Wise

greenhouse:
  - careem  # Dubai, UAE super-app (Uber-owned) — verified live 2026-08-18, 231 real postings incl. Dubai/UAE
  # Everything below: real Greenhouse board confirmed live 2026-08-18 (non-empty
  # jobs array, not just a non-404 response) for a company already in
  # config/companies_allowlist.yml whose board had never been auto-discovered —
  # none of these companies ever happened to appear in another curated source
  # first, so discover_job_board_sources() never had a URL to find them from.
  - linkedin
  - datadog
  - databricks
  - mongodb
  - elastic
  - twilio
  - stripe
  - okta
  - figma
  - dropbox
  - asana
  - anthropic
  - deepmind
  - scaleai
  - n26
  - lyft
  - airbnb
  - janestreet
  - coupang
  - baidu
  - jumia
  - block
  - robinhood
  - instacart
  - pinterest
  - reddit
  - roblox
  - epicgames
  - discord
  - duolingo
  - webflow
  # Second verification pass, 2026-08-18: three companies that had transient
  # connection failures in the first pass, retried and confirmed real.
  - cloudflare
  - spacex
  - coinbase

lever:
  # Same discipline: real Lever board confirmed live 2026-08-18 with actual
  # postings, not just a non-404 response.
  - spotify
  - palantir
  - paytm
  - dlocal
