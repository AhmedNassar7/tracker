# Hand-curated tech / career events — conferences, summits, and career fairs
# that don't show up in any pollable API the pipeline already has (the
# hackathon feeds cover Devpost/Unstop/Devfolio; Luma's discover page is
# scraped separately). This is the same idea as a community-maintained
# "SWE events" list: a small file a human keeps current.
#
# Format (no YAML dependency — the same simple line parsing the other
# configs use):
#   Name | Organizer | City, Country | START_DATE | URL
# START_DATE is ISO YYYY-MM-DD (the first day of the event).
# Lines starting with '#' and blank lines are ignored.
#
# The pipeline shows each event with a countdown ("in 12 days") and, when
# it can verify a link is dead, drops it. **A past-dated event is hidden
# automatically** — so for an annual event, just bump its date to next
# year's edition when it's announced (leave the row here as a reminder).
# Verify the date and URL against the organizer's own site before editing.

